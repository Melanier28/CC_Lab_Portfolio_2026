<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chronically Online Test</title>
  <link rel="stylesheet" href="quizStyle.css">
</head>

<body>

  <div class="quiz-container">
    <h1>How Chronically Online Are You?</h1>

    <!-- quiz content appears here -->
    <div id="quiz"></div>

    <!-- start button -->
    <button id="startBtn">Start Quiz</button>

    <!-- next button (hidden until needed) -->
    <button id="nextBtn" style="display:none;">Next</button>

    <!-- result output -->
    <div id="result"></div>
  </div>

  <!-- IMPORTANT: script must be at bottom -->
  <script src="quizScript.js"></script>

</body>
</html>
